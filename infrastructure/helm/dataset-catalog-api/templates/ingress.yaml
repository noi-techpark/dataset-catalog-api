{{- if .Values.ingress.hosts }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dataset-catalog-api.name" . }}
  labels:
    {{- include "dataset-catalog-api.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dataset-catalog-api.name" $ }}
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
